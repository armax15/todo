services:
  # Frontend Next.js Application
  - type: web
    name: task-manager-frontend
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
    autoDeploy: true
    branch: main

  # PostgreSQL Database
  - type: pserv
    name: task-manager-db
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 10
